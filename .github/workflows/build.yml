name: Build EZIN (unsigned iOS)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build unsigned .ipa
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Try Xcode 15.x first (macos-14 default), then fall back
          XCODE_PATH=""
          for p in /Applications/Xcode_15*.app /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$p" ]; then
              XCODE_PATH="$p"
              break
            fi
          done
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project EZIN.xcodeproj \
            -scheme EZIN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          # Find the .app in the derived data build products
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in build products!"
            find build/Build/Products -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr EZIN-unsigned.ipa Payload
          ls -lh EZIN-unsigned.ipa
          rm -rf Payload

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZIN-unsigned-ipa
          path: EZIN-unsigned.ipa
          retention-days: 5
          if-no-files-found: error

      - name: Publish unsigned .ipa to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete previous release and tag if they exist
          gh release delete build-latest -y --cleanup-tag 2>/dev/null || true
          # Give a moment for the tag cleanup
          sleep 2
          # Create new release
          gh release create build-latest EZIN-unsigned.ipa \
            --title "EZIN — latest unsigned iOS build" \
            --notes "Unsigned .ipa built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
